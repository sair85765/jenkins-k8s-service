
apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-k8s-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-k8s-app

  template:
    metadata:
      labels:
        app: jenkins-k8s-app

    spec:
      containers:
        - name: web-app
          image: saiprashanth2006/jenkins-k8s-app:v1
          ports:
            - containerPort: 80
